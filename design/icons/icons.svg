<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute">
  <!--
    20px stroke icon set for both frontends. One source for Astro and Next.js.
    Use: <svg class="icon" width="20" height="20" aria-hidden="true"><use href="/icons.svg#i-task"/></svg>
    Rules: stroke is currentColor, fill is none, stroke-width 1.6, round caps and joins.
    Every icon is a control or a label's companion, never decoration. Compose nothing from a library.
  -->
  <defs>
    <g id="i-stroke" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <symbol id="i-task" viewBox="0 0 24 24">
      <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
      <path d="M8 12.4l2.7 2.7L16.4 9"/>
    </symbol>

    <symbol id="i-note" viewBox="0 0 24 24">
      <path d="M6 3.5h9.2L20 8.3v12.2H6z"/>
      <path d="M15 3.8V8.5h4.6"/>
      <path d="M9 12.5h7M9 16h5"/>
    </symbol>

    <symbol id="i-image" viewBox="0 0 24 24">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/>
      <circle cx="9" cy="10" r="1.6"/>
      <path d="M4.2 17.4l4.6-4.2 3.4 3 2.6-2.3 4.9 4.2"/>
    </symbol>

    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.8" cy="10.8" r="6.3"/>
      <path d="M15.5 15.5l4.2 4.2"/>
    </symbol>

    <symbol id="i-pin" viewBox="0 0 24 24">
      <path d="M9 3.5h6l-.9 4.2 3.4 3.3-4.7 1.4L12 20.5l-1.2-8.1-4.7-1.4 3.4-3.3z"/>
    </symbol>

    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>

    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15M9.5 7V4.8h5V7"/>
      <path d="M6.6 7l1 12.2h8.8L17.4 7"/>
      <path d="M10.4 10.6v5.6M13.6 10.6v5.6"/>
    </symbol>

    <symbol id="i-chevron-down" viewBox="0 0 24 24">
      <path d="M7.5 10l4.5 4.4 4.5-4.4"/>
    </symbol>

    <symbol id="i-arrow-left" viewBox="0 0 24 24">
      <path d="M19 12H5.6M11 5.6L5 12l6 6.4"/>
    </symbol>

    <symbol id="i-arrow-right" viewBox="0 0 24 24">
      <path d="M5 12h13.4M13 5.6l6 6.4-6 6.4"/>
    </symbol>

    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"/>
    </symbol>

    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3.6" y="5.4" width="16.8" height="15" rx="2.6"/>
      <path d="M3.6 10h16.8M8.4 3.4v3.4M15.6 3.4v3.4"/>
    </symbol>

    <symbol id="i-logout" viewBox="0 0 24 24">
      <path d="M14.5 4.5h3.9a1 1 0 011 1v13a1 1 0 01-1 1h-3.9"/>
      <path d="M4.5 12h9.2M10.6 8.2l3.6 3.8-3.6 3.8"/>
    </symbol>

    <symbol id="i-menu" viewBox="0 0 24 24">
      <path d="M4.5 7h15M4.5 12h15M4.5 17h15"/>
    </symbol>

    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M12 4.8l8 14.2H4z"/>
      <path d="M12 10v3.4M12 16.4v.6"/>
    </symbol>
  </defs>
</svg>
